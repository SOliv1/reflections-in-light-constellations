name: API safeguards

on:
  push:
    branches: ["master"]
    paths:
      - "apps/api/**"
      - "tools/smoke-api.mjs"
      - ".github/workflows/api.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "apps/api/**"
      - "tools/smoke-api.mjs"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  verify-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Test API routes
        working-directory: apps/api
        run: npm test

      - name: Build API using Railway's Docker context
        run: docker build -f apps/api/Dockerfile apps/api

  smoke-production:
    if: github.event_name == 'push'
    needs: verify-api
    runs-on: ubuntu-latest
    env:
      EXPECTED_RELEASE: ${{ github.sha }}
      SMOKE_RETRIES: 60
      SMOKE_DELAY_MS: 10000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify API service
        run: node tools/smoke-api.mjs https://reflections-in-light-constellations-production.up.railway.app

      - name: Verify web proxy
        run: node tools/smoke-api.mjs https://sparkling-gratitude-production-e9a3.up.railway.app
